<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kids Chore Points</title>
<style>
:root{
  --bg:#f6f7fb;--card:#ffffff;--fg:#14161f;--muted:#4b5163;--border:#e2e5ee;--soft:#eef0f6;
  --primary:#3b4fc4;--primary-fg:#ffffff;--primary-soft:#e7eafb;
  --ok:#0f7a4a;--ok-soft:#e3f6ec;--ok-fg:#0b4d30;
  --bad:#b42318;--bad-soft:#fde8e6;--bad-fg:#7a1a12;
  --info:#1d5fbf;--info-soft:#e4eefc;--info-fg:#143f7f;
  --gold:#b45309;--gold-soft:#fdf0dc;--gold-fg:#6b3407;--gold-mark:#f59e0b;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1117;--card:#181b24;--fg:#f2f3f7;--muted:#b4b9c8;--border:#2b2f3c;--soft:#222633;
    --primary:#7d8cf0;--primary-fg:#0f1117;--primary-soft:#262c4d;
    --ok:#4ccf8f;--ok-soft:#12301f;--ok-fg:#c8f2dc;
    --bad:#ff8a80;--bad-soft:#3a1715;--bad-fg:#ffd5d0;
    --info:#86b4ff;--info-soft:#152844;--info-fg:#d3e3ff;
    --gold:#fbbf24;--gold-soft:#3a2a0e;--gold-fg:#fde7b0;--gold-mark:#f59e0b;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:var(--bg);color:var(--fg)}
body{margin:0;min-height:100vh;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.wrap{max-inline-size:1120px;margin-inline:auto;padding:20px 16px 48px}
header.top{position:sticky;inset-block-start:0;z-index:10;background:var(--card);border-block-end:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.logo{inline-size:34px;block-size:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center}
.logo svg{inline-size:20px;block-size:20px;fill:var(--primary-fg)}
.family{color:var(--muted);font-weight:500;font-size:.95rem}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--primary);color:var(--primary-fg);min-block-size:38px}
.btn:hover{filter:brightness(1.07)}
.btn.outline{background:var(--card);color:var(--fg);border-color:var(--border)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.ghost:hover,.btn.outline:hover{background:var(--soft);filter:none}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;min-block-size:32px;font-size:.9rem}
.btn.icon{padding:6px;min-inline-size:34px;min-block-size:34px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.15rem;margin:0 0 12px}
h3{font-size:1rem;margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;gap:20px;grid-template-columns:1.15fr 1fr}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.alert{border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold-fg);border-radius:10px;padding:10px 14px;margin-block-end:16px}
.avatar{inline-size:38px;block-size:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.avatar.lg{inline-size:60px;block-size:60px;font-size:1.6rem}
.avatar.sm{inline-size:28px;block-size:28px;font-size:.8rem}
.c0{background:#1d6fa5}.c1{background:#be123c}.c2{background:#047857}.c3{background:#6d28d9}.c4{background:#b45309}.c5{background:#0f766e}
.kidpick{display:flex;gap:10px;flex-wrap:wrap;margin-block-end:20px}
.kidbtn{display:flex;align-items:center;gap:10px;border:2px solid var(--border);background:var(--card);border-radius:999px;padding:4px 16px 4px 4px;cursor:pointer;font-weight:600}
.kidbtn[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.score{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-block-end:20px}
.big{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.bar{block-size:10px;background:var(--primary-soft);border-radius:999px;overflow:hidden}
.bar>span{display:block;block-size:100%;background:var(--primary);border-radius:999px}
ul.clean{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:12px;inline-size:100%;text-align:start;min-block-size:58px;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;margin-block-end:8px}
.task:hover{background:var(--soft)}
.task[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.tick{inline-size:32px;block-size:32px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex:none}
.task[aria-pressed="true"] .tick{background:var(--ok);border-color:var(--ok)}
.tick svg{inline-size:18px;block-size:18px;stroke:#fff;fill:none;stroke-width:3;display:none}
@media (prefers-color-scheme: dark){.tick svg{stroke:#0f1117}}
.task[aria-pressed="true"] .tick svg{display:block}
.task .t{flex:1;font-weight:600}
.pill{border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--fg);white-space:nowrap}
.task[aria-pressed="true"] .pill{background:var(--ok);color:var(--card)}
.b-task{background:var(--ok-soft);color:var(--ok-fg)}
.b-bonus{background:var(--info-soft);color:var(--info-fg)}
.b-deduction{background:var(--bad-soft);color:var(--bad-fg)}
.b-reward{background:var(--gold-soft);color:var(--gold-fg)}
.list>li{display:flex;align-items:center;gap:12px;padding:10px 0;border-block-end:1px solid var(--border)}
.list>li:last-child{border-block-end:0}
.grow{flex:1;min-inline-size:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:800;font-variant-numeric:tabular-nums;min-inline-size:3.2em;text-align:end}
.amt.pos{color:var(--ok)}.amt.neg{color:var(--bad)}
.small{font-size:.85rem}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-block-end:1px solid var(--border);margin-block-end:20px}
.tab{background:none;border:0;border-block-end:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-block-end-color:var(--primary)}
.kidcards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-block:12px}
form.stack{display:grid;gap:12px}
label.f{display:grid;gap:5px;font-weight:600;font-size:.92rem}
input[type=text],input[type=number],input[type=password],input[type=email],select{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 11px;min-block-size:40px;inline-size:100%}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:8px;cursor:pointer;font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--primary);color:var(--primary-fg)}
.seg label:has(input:focus-visible){outline:3px solid var(--primary);outline-offset:-3px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches .avatar{border:3px solid transparent}
.swatches input:checked + .avatar{border-color:var(--fg)}
.swatches input:focus-visible + .avatar{outline:3px solid var(--primary);outline-offset:2px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;align-items:center;gap:6px;font-weight:500}
.err{color:var(--bad);font-size:.9rem;margin:0}
dialog{border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--fg);padding:22px;inline-size:min(460px,92vw)}
dialog::backdrop{background:rgba(10,12,20,.55)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-block-start:6px}
.hero{max-inline-size:520px;margin:40px auto}
.empty{padding:24px;text-align:center;color:var(--muted)}
figure{margin:0}
svg text{font-family:inherit}
.week{display:flex;align-items:flex-end;gap:6px;block-size:70px;margin-block:8px 2px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;block-size:100%}
.week i{display:block;inline-size:100%;background:var(--primary);border-radius:4px 4px 0 0;min-block-size:2px}
.week b{font-size:.72rem;font-weight:600;color:var(--muted)}
.weeklbl{display:flex;gap:6px}.weeklbl span{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:.85rem;text-align:center;padding:24px}
@media (forced-colors: active){.btn,.task,.kidbtn,.tab{border:1px solid ButtonText}.task[aria-pressed="true"],.kidbtn[aria-pressed="true"],.tab[aria-selected="true"]{outline:3px solid Highlight}}
.brandbtn{background:none;border:0;padding:0;cursor:pointer}
.home{display:grid;gap:20px;grid-template-columns:1fr 1fr;margin-block-start:20px}
@media (max-width:760px){.home{grid-template-columns:1fr}}
.home .card{display:flex;flex-direction:column;gap:10px}
.lead{font-size:1.1rem;max-inline-size:640px}
.steps{list-style:none;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-block-start:20px}
.num{inline-size:30px;block-size:30px;border-radius:50%;background:var(--primary-soft);color:var(--fg);display:grid;place-items:center;font-weight:800;flex:none}
.code{font-family:ui-monospace,Consolas,monospace;font-size:1.6rem;font-weight:800;letter-spacing:.15em}
.linkbox{font-family:ui-monospace,Consolas,monospace;font-size:.85rem;background:var(--soft);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.kidhero{max-inline-size:440px;margin:30px auto}
.kidhero input{font-size:1.15rem;min-block-size:48px}
.kidhero .btn{min-block-size:48px;font-size:1.05rem}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:600;background:var(--soft)}
.tag.ok{background:var(--ok-soft);color:var(--ok-fg)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:600;cursor:pointer;text-decoration:underline}
@media (max-width:560px){.hide-sm{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand brandbtn" data-action="home" aria-label="Kids Chore Points home"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.4 5 5.4.6-4 3.7 1.1 5.4L12 15.5l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z"/></svg></span><span class="hide-sm">Kids Chore Points</span></button>
  <span class="family" id="familyName"></span>
  <span class="spacer"></span>
  <nav id="nav" class="row" aria-label="Main"></nav>
</div></header>
<main id="app" class="wrap" tabindex="-1"></main>
<footer>Kids Chore Points</footer>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   ONLINE ACCOUNTS (optional) - see README.md, "Connect Firebase".
   Leave this as null to run in demo mode (everything stays in this browser).
   To let parents and kids log in from any device, replace null with the
   firebaseConfig object from your Firebase project, for example:
   window.KCP_FIREBASE_CONFIG = { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." };
   ===================================================================== */
window.KCP_FIREBASE_CONFIG = null;
</script>
<script>
(function(){
"use strict";
/* ================= shared helpers ================= */
var COLORS=6;
var DEFAULT_TASKS=[["Make your bed",5],["Get dressed by yourself",5],["Brush teeth (morning & night)",3],["Help mom with cleaning",10],["Tidy up your toys",5],["Finish homework",10],["Help set the table",5]];
var DEFAULT_REWARDS=[["Ice cream treat",30],["Extra 30 min screen time",50],["Trip to the park",100],["Pick a new toy",200]];
var QUICK=[["Good behaviour",5],["Extra helpful",10],["Not listening",-5],["Fighting",-10]];
var TYPE_LABEL={task:"Task",bonus:"Bonus",deduction:"Deducted",reward:"Reward"};
var CODE_CHARS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
var LAST_FAMILY="kidsChorePoints:lastFamily";

function id(){var a="";try{var b=new Uint8Array(8);crypto.getRandomValues(b);b.forEach(function(x){a+=(x%36).toString(36);});}catch(e){a=Math.random().toString(36).slice(2,10);}return "x"+Date.now().toString(36)+a;}
function genCode(){var s="";try{var b=new Uint8Array(6);crypto.getRandomValues(b);b.forEach(function(x){s+=CODE_CHARS[x%CODE_CHARS.length];});}catch(e){for(var i=0;i<6;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];}return s;}
function err(code,msg){var e=new Error(msg||code);e.code=code;return e;}
function kidPw(p){return "kcp-"+p;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function fallbackHash(s){var h1=0x811c9dc5,h2=0x1b873593;for(var i=0;i<s.length;i++){h1^=s.charCodeAt(i);h1=Math.imul(h1,16777619);h2=Math.imul(h2^s.charCodeAt(i),2654435761);}return "f"+(h1>>>0).toString(16)+(h2>>>0).toString(16);}
function hashText(text){
  try{if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(text)).then(function(buf){return "s"+Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,"0");}).join("");}).catch(function(){return fallbackHash(text);});}}catch(e){}
  return Promise.resolve(fallbackHash(text));
}
function newFamily(code,o,uid,email){
  return {code:code,name:o.familyName,kids:[],totals:{},createdAt:Date.now(),
    parents:[{uid:uid,name:o.parentName,email:email}],
    tasks:o.defaults?DEFAULT_TASKS.map(function(t){return {id:id(),title:t[0],points:t[1],kidIds:[]};}):[],
    rewards:o.defaults?DEFAULT_REWARDS.map(function(r){return {id:id(),title:r[0],cost:r[1]};}):[]};
}
function kidEmail(fid,username){return (fid+"-"+username+"-"+Date.now().toString(36)+"@kids.example.com").toLowerCase();}

/* ================= demo store: everything in this browser ================= */
function demoStore(){
  var K="kidsChorePoints:demo:v2",SK="kidsChorePoints:demo:session";
  var db=null,subs=[],authCb=null;
  function read(){var d=null;try{var r=localStorage.getItem(K);if(r)d=JSON.parse(r);}catch(e){}
    if(!d||typeof d!=="object"||!d.accounts||!d.users||!d.logins||!d.families)d={accounts:{},users:{},logins:{},families:{}};db=d;}
  function notify(){subs.slice().forEach(function(f){f();});}
  function write(){try{localStorage.setItem(K,JSON.stringify(db));}catch(e){throw err("storage");}notify();}
  function getSid(){try{return localStorage.getItem(SK);}catch(e){return null;}}
  function setSid(v){try{if(v)localStorage.setItem(SK,v);else localStorage.removeItem(SK);}catch(e){}}
  function prof(uid){var u=uid&&db.users[uid];return u?{uid:uid,role:u.role,familyId:u.familyId,kidId:u.kidId||null,name:u.name||"",email:u.email||""}:null;}
  async function makeAcct(email,pw){if(db.accounts[email])throw err("auth/email-already-in-use");var salt=id(),uid=id();db.accounts[email]={uid:uid,salt:salt,hash:await hashText(salt+":"+pw)};return uid;}
  async function check(email,pw){var a=db.accounts[email];if(!a)throw err("bad-login");if(await hashText(a.salt+":"+pw)!==a.hash)throw err("bad-login");return a.uid;}
  function fam(fid){var f=db.families[fid];if(!f)throw err("not-found");return f;}
  function dropAcct(uid){Object.keys(db.accounts).forEach(function(e){if(db.accounts[e].uid===uid)delete db.accounts[e];});delete db.users[uid];}
  function dropKidLogin(fid,k){if(k.uid)dropAcct(k.uid);if(k.username)delete db.logins[fid+"_"+k.username];k.username=null;k.uid=null;}
  window.addEventListener("storage",function(e){
    if(e.key===K){read();notify();}
    else if(e.key===SK&&authCb){read();authCb(prof(getSid()));}
  });
  return {
    mode:"demo",
    init:async function(cb){authCb=cb;read();cb(prof(getSid()));},
    register:async function(o){read();var email=o.email.trim().toLowerCase();
      var uid=await makeAcct(email,o.password);var code;do{code=genCode();}while(db.families[code]);
      db.users[uid]={role:"parent",familyId:code,name:o.parentName,email:email};
      var f=newFamily(code,o,uid,email);f.ledger=[];db.families[code]=f;write();setSid(uid);return prof(uid);},
    loginParent:async function(email,pw){read();var uid=await check(email.trim().toLowerCase(),pw);if(!db.users[uid])throw err("bad-login");setSid(uid);return prof(uid);},
    loginKid:async function(code,username,pw){read();var l=db.logins[code+"_"+username];if(!l)throw err("bad-login");var uid=await check(l.email,kidPw(pw));if(!db.users[uid])throw err("bad-login");setSid(uid);return prof(uid);},
    logout:async function(){setSid(null);},
    sendReset:async function(){throw err("demo-only");},
    changePassword:async function(oldPw,newPw){read();var s=prof(getSid());if(!s)throw err("bad-login");await check(s.email,oldPw);var a=db.accounts[s.email];a.salt=id();a.hash=await hashText(a.salt+":"+newPw);write();},
    watchFamily:function(fid,cb){var f=function(){var x=db.families[fid];if(!x)return cb(null);var c=clone(x);var l=c.ledger||[];delete c.ledger;cb({fam:c,ledger:l.sort(function(a,b){return b.ts-a.ts;}).slice(0,500)});};
      subs.push(f);f();return function(){subs=subs.filter(function(z){return z!==f;});};},
    mutate:async function(fid,fn){read();var f=fam(fid);Object.assign(f,fn(clone(f)));write();},
    addEntry:async function(fid,e){read();var f=fam(fid);f.ledger.push(e);f.totals[e.kidId]=(f.totals[e.kidId]||0)+e.amount;write();},
    deleteEntry:async function(fid,e){read();var f=fam(fid);var i=f.ledger.findIndex(function(x){return x.id===e.id;});if(i<0)return;f.ledger.splice(i,1);f.totals[e.kidId]=(f.totals[e.kidId]||0)-e.amount;write();},
    setKidLogin:async function(fid,kidId,username,pw){read();var f=fam(fid);var k=f.kids.find(function(x){return x.id===kidId;});if(!k)throw err("not-found");
      var lid=fid+"_"+username;if(db.logins[lid]&&db.logins[lid].kidId!==kidId)throw err("username-taken");
      var email=kidEmail(fid,username);var uid=await makeAcct(email,kidPw(pw));dropKidLogin(fid,k);
      db.users[uid]={role:"kid",familyId:fid,kidId:kidId,name:k.name};db.logins[lid]={email:email,familyId:fid,kidId:kidId,uid:uid};
      k.username=username;k.uid=uid;write();},
    removeKidLogin:async function(fid,kidId){read();var f=fam(fid);var k=f.kids.find(function(x){return x.id===kidId;});if(!k)return;dropKidLogin(fid,k);write();},
    deleteKid:async function(fid,kidId){read();var f=fam(fid);var k=f.kids.find(function(x){return x.id===kidId;});if(!k)return;dropKidLogin(fid,k);
      f.kids=f.kids.filter(function(x){return x.id!==kidId;});f.tasks.forEach(function(t){t.kidIds=t.kidIds.filter(function(x){return x!==kidId;});});
      delete f.totals[kidId];f.ledger=f.ledger.filter(function(e){return e.kidId!==kidId;});write();},
    addParent:async function(fid,name,email,pw){read();var f=fam(fid);email=email.trim().toLowerCase();var uid=await makeAcct(email,pw);
      db.users[uid]={role:"parent",familyId:fid,name:name,email:email};f.parents.push({uid:uid,name:name,email:email});write();},
    removeParent:async function(fid,uid){read();var f=fam(fid);f.parents=f.parents.filter(function(p){return p.uid!==uid;});dropAcct(uid);write();}
  };
}

/* ================= cloud store: Firebase (Auth + Firestore) ================= */
function cloudStore(cfg){
  var V="10.12.2",BASE="https://www.gstatic.com/firebasejs/"+V+"/";
  var A,AU,FS,app,auth,db,loading=null,suppress=0,authCb=null;
  function load(){if(!loading)loading=Promise.all([import(BASE+"firebase-app.js"),import(BASE+"firebase-auth.js"),import(BASE+"firebase-firestore.js")]).then(function(m){
    A=m[0];AU=m[1];FS=m[2];app=A.initializeApp(cfg);auth=AU.getAuth(app);db=FS.getFirestore(app);});return loading;}
  function famRef(fid){return FS.doc(db,"families",fid);}
  async function profile(user){var s=await FS.getDoc(FS.doc(db,"users",user.uid));
    if(!s.exists())return {uid:user.uid,email:user.email||"",role:null,familyId:null,kidId:null,name:""};
    var d=s.data();return {uid:user.uid,email:user.email||"",role:d.role,familyId:d.familyId,kidId:d.kidId||null,name:d.name||""};}
  async function quiet(fn){suppress++;try{return await fn();}finally{suppress--;}}
  async function makeUser(email,pw){var sec=A.initializeApp(cfg,"helper-"+id());
    try{var sa=AU.initializeAuth(sec,{persistence:AU.inMemoryPersistence});var c=await AU.createUserWithEmailAndPassword(sa,email,pw);var uid=c.user.uid;await AU.signOut(sa);return uid;}
    finally{try{await A.deleteApp(sec);}catch(e){}}}
  function kidOf(d,kidId){var k=(d.kids||[]).find(function(x){return x.id===kidId;});if(!k)throw err("not-found");return k;}
  return {
    mode:"cloud",
    init:async function(cb){authCb=cb;await load();AU.onAuthStateChanged(auth,async function(u){if(suppress)return;if(!u)return cb(null);try{cb(await profile(u));}catch(e){cb(null);}});},
    register:function(o){return quiet(async function(){
      var user=auth.currentUser;
      if(!user||(o.email&&user.email!==o.email.trim().toLowerCase())){if(user)await AU.signOut(auth);user=(await AU.createUserWithEmailAndPassword(auth,o.email.trim(),o.password)).user;}
      for(var i=0;i<4;i++){var code=genCode();var b=FS.writeBatch(db);
        b.set(FS.doc(db,"users",user.uid),{role:"parent",familyId:code,name:o.parentName,email:user.email});
        b.set(famRef(code),newFamily(code,o,user.uid,user.email));
        try{await b.commit();return await profile(user);}catch(e){if(e.code!=="permission-denied"||i===3)throw e;}}
    });},
    loginParent:function(email,pw){return quiet(async function(){var c=await AU.signInWithEmailAndPassword(auth,email.trim(),pw);return profile(c.user);});},
    loginKid:function(code,username,pw){return quiet(async function(){
      if(auth.currentUser)await AU.signOut(auth);
      var s=await FS.getDoc(FS.doc(db,"logins",code+"_"+username));if(!s.exists())throw err("bad-login");
      var c=await AU.signInWithEmailAndPassword(auth,s.data().email,kidPw(pw));var p=await profile(c.user);
      if(!p.role){await AU.signOut(auth);throw err("bad-login");}return p;});},
    logout:function(){return quiet(function(){return AU.signOut(auth);});},
    sendReset:function(email){return AU.sendPasswordResetEmail(auth,email.trim());},
    changePassword:async function(oldPw,newPw){var u=auth.currentUser;if(!u)throw err("bad-login");
      await AU.reauthenticateWithCredential(u,AU.EmailAuthProvider.credential(u.email,oldPw));await AU.updatePassword(u,newPw);},
    watchFamily:function(fid,cb){var f=null,l=null;function emit(){if(f!==null&&l!==null)cb(f===false?null:{fam:f,ledger:l});}
      function onErr(e){cb(null,e);}
      var u1=FS.onSnapshot(famRef(fid),function(s){f=s.exists()?s.data():false;emit();},onErr);
      var u2=FS.onSnapshot(FS.query(FS.collection(db,"families",fid,"ledger"),FS.orderBy("ts","desc"),FS.limit(500)),function(s){l=s.docs.map(function(d){return d.data();});emit();},onErr);
      return function(){u1();u2();};},
    mutate:function(fid,fn){return FS.runTransaction(db,async function(tx){var s=await tx.get(famRef(fid));if(!s.exists())throw err("not-found");tx.update(famRef(fid),fn(s.data()));});},
    addEntry:function(fid,e){var b=FS.writeBatch(db);b.set(FS.doc(db,"families",fid,"ledger",e.id),e);var p={};p["totals."+e.kidId]=FS.increment(e.amount);b.update(famRef(fid),p);return b.commit();},
    deleteEntry:function(fid,e){var b=FS.writeBatch(db);b.delete(FS.doc(db,"families",fid,"ledger",e.id));var p={};p["totals."+e.kidId]=FS.increment(-e.amount);b.update(famRef(fid),p);return b.commit();},
    setKidLogin:async function(fid,kidId,username,pw){
      var lid=fid+"_"+username,ls=await FS.getDoc(FS.doc(db,"logins",lid));
      if(ls.exists()&&ls.data().kidId!==kidId)throw err("username-taken");
      var email=kidEmail(fid,username),uid=await makeUser(email,kidPw(pw));
      await FS.runTransaction(db,async function(tx){var s=await tx.get(famRef(fid));if(!s.exists())throw err("not-found");var d=s.data(),k=kidOf(d,kidId);
        if(k.uid)tx.delete(FS.doc(db,"users",k.uid));
        if(k.username&&k.username!==username)tx.delete(FS.doc(db,"logins",fid+"_"+k.username));
        tx.set(FS.doc(db,"users",uid),{role:"kid",familyId:fid,kidId:kidId,name:k.name});
        tx.set(FS.doc(db,"logins",lid),{email:email,familyId:fid,kidId:kidId,uid:uid});
        tx.update(famRef(fid),{kids:d.kids.map(function(x){return x.id===kidId?Object.assign({},x,{username:username,uid:uid}):x;})});});},
    removeKidLogin:function(fid,kidId){return FS.runTransaction(db,async function(tx){var s=await tx.get(famRef(fid));var d=s.data(),k=kidOf(d,kidId);
        if(k.uid)tx.delete(FS.doc(db,"users",k.uid));if(k.username)tx.delete(FS.doc(db,"logins",fid+"_"+k.username));
        tx.update(famRef(fid),{kids:d.kids.map(function(x){return x.id===kidId?Object.assign({},x,{username:null,uid:null}):x;})});});},
    deleteKid:async function(fid,kidId){
      await FS.runTransaction(db,async function(tx){var s=await tx.get(famRef(fid));var d=s.data(),k=kidOf(d,kidId);
        if(k.uid)tx.delete(FS.doc(db,"users",k.uid));if(k.username)tx.delete(FS.doc(db,"logins",fid+"_"+k.username));
        var p={kids:d.kids.filter(function(x){return x.id!==kidId;}),tasks:d.tasks.map(function(t){return Object.assign({},t,{kidIds:t.kidIds.filter(function(x){return x!==kidId;})});})};
        p["totals."+kidId]=FS.deleteField();tx.update(famRef(fid),p);});
      var q=await FS.getDocs(FS.query(FS.collection(db,"families",fid,"ledger"),FS.where("kidId","==",kidId)));
      for(var i=0;i<q.docs.length;i+=400){var b=FS.writeBatch(db);q.docs.slice(i,i+400).forEach(function(d){b.delete(d.ref);});await b.commit();}},
    addParent:async function(fid,name,email,pw){email=email.trim().toLowerCase();var uid=await makeUser(email,pw);
      await FS.runTransaction(db,async function(tx){var s=await tx.get(famRef(fid));var d=s.data();
        tx.set(FS.doc(db,"users",uid),{role:"parent",familyId:fid,name:name,email:email});
        tx.update(famRef(fid),{parents:(d.parents||[]).concat([{uid:uid,name:name,email:email}])});});},
    removeParent:function(fid,uid){return FS.runTransaction(db,async function(tx){var s=await tx.get(famRef(fid));var d=s.data();
        tx.delete(FS.doc(db,"users",uid));tx.update(famRef(fid),{parents:(d.parents||[]).filter(function(p){return p.uid!==uid;})});});}
  };
}

function parseRoute(){var h=location.hash.replace(/^#\/?/,"");var parts=h.split("?");return {path:parts[0]||"",params:new URLSearchParams(parts[1]||"")};}
function go(path){if(location.hash==="#/"+path)render();else location.hash="#/"+path;}
function guard(){
  if(session===undefined)return;
  var r=parseRoute(),p=r.path,target=null;
  if(session&&session.role==="parent"){if(p===""||p==="login"||p==="register")target="parent";}
  else if(session&&session.role==="kid"){if(p!=="me")target="me";}
  else if(session&&!session.role){if(p!=="register")target="register";}
  else if(p==="parent"||p==="me")target="";
  if(target!==null&&target!==p){history.replaceState(null,"","#/"+target);}
}
function setSession(s){
  session=s;if(unwatch){unwatch();unwatch=null;}fam=null;ledger=[];famErr=null;

}

function rewardPath(kid,bal){
  var rs=fam.rewards.slice().sort(function(a,b){return a.cost-b.cost;});
  var max=Math.max.apply(null,[bal,50].concat(rs.map(function(r){return r.cost;})));
  var W=460,x0=24,x1=W-24,y=80;function X(v){return x0+(x1-x0)*Math.max(0,v)/max;}
  var bx=X(bal);
  var desc=kid.name+" has "+bal+" points. "+(rs.length?rs.map(function(r){return r.title+": "+r.cost+" points, "+(bal>=r.cost?"reached":(r.cost-bal)+" to go");}).join("; "):"No rewards set.");
  var s='<svg viewBox="0 0 '+W+' 160" width="100%" role="img" aria-labelledby="rpT rpD"><title id="rpT">'+esc(kid.name)+"'s reward path</title><desc id=\"rpD\">"+esc(desc)+'</desc>';
  s+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--soft)" stroke-width="14" stroke-linecap="round"/>';
  if(bal>0)s+='<line x1="'+x0+'" y1="'+y+'" x2="'+bx+'" y2="'+y+'" stroke="var(--primary)" stroke-width="14" stroke-linecap="round"/>';
  rs.forEach(function(r,i){var rx=X(r.cost),ok=bal>=r.cost,above=i%2===0;var lbl=r.title.length>18?r.title.slice(0,17)+"\u2026":r.title;var anchor=rx>W-70?"end":rx<70?"start":"middle";
    s+='<circle cx="'+rx+'" cy="'+y+'" r="16" stroke-width="3" fill="'+(ok?"var(--gold-mark)":"var(--card)")+'" stroke="'+(ok?"var(--gold)":"var(--border)")+'"/>';
    s+='<text x="'+rx+'" y="'+(y+4)+'" text-anchor="middle" font-size="12" font-weight="700" fill="'+(ok?"#3b2004":"var(--fg)")+'">'+r.cost+'</text>';
    s+='<text x="'+rx+'" y="'+(above?y-26:y+38)+'" text-anchor="'+anchor+'" font-size="13" fill="var(--fg)">'+esc(lbl)+'</text>';});
  s+='<circle cx="'+bx+'" cy="'+y+'" r="9" fill="var(--primary)" stroke="var(--card)" stroke-width="3"/>';
  s+='<text x="'+bx+'" y="154" text-anchor="'+(bx>W-60?"end":bx<60?"start":"middle")+'" font-size="14" font-weight="700" fill="var(--fg)">'+esc(kid.name)+': '+bal+'</text></svg>';
  var next=rs.find(function(r){return r.cost>bal;});
  var cap=next?'<strong>'+(next.cost-bal)+' points</strong> to '+esc(next.title):(rs.length?'<strong>Every reward reached!</strong>':'No rewards yet');
  return '<figure>'+s+'<figcaption class="small">'+cap+'</figcaption></figure>';
}

    var v=ledger.filter(function(e){return e.kidId===kidId&&e.date===k&&e.amount>0;}).reduce(function(s,e){return s+e.amount;},0);
    max=Math.max(max,v);days.push([d.toLocaleDateString(undefined,{weekday:"narrow"}),v,d.toLocaleDateString(undefined,{weekday:"long"})]);}
  var h='<div class="small"><strong>Points earned, last 7 days</strong></div><div class="week" aria-hidden="true">';
  days.forEach(function(d){h+='<div><b>'+d[1]+'</b><i style="block-size:'+(d[1]/max*48)+'px"></i></div>';});
  h+='</div><div class="weeklbl" aria-hidden="true">';days.forEach(function(d){h+='<span>'+esc(d[0])+'</span>';});
  h+='</div><ul class="sr">';days.forEach(function(d){h+='<li>'+esc(d[2])+': '+d[1]+' points</li>';});

}

var dlgHandler=null;

  var f=dlg.querySelector("input:not([type=radio]):not([type=checkbox]),select,input");if(f)f.focus();else{var b=dlg.querySelector("[type=submit]");if(b)b.focus();}
}
function closeDialog(){dlgHandler=null;try{dlg.close();}catch(e){dlg.removeAttribute("open");}dlg.innerHTML="";}
function dlgErr(m){var e=document.getElementById("dlgErr");if(e)e.textContent=m;}
function confirmBox(title,msg,label,fn){openDialog(title,'<p style="margin:0">'+esc(msg)+'</p>',fn,label,true);}

function checkUsername(u){return /^[a-z0-9][a-z0-9.-]{1,19}$/.test(u);}

function readLogin(fd,required){
  var u=String(fd.get("username")||"").trim().toLowerCase(),p=String(fd.get("kidpw")||"");

  if(!checkUsername(u)){dlgErr("Usernames are 2\u201320 lowercase letters, numbers, dots or dashes.");return null;}
  if(p.length<4){dlgErr("The password needs at least 4 characters.");return null;}
  return {username:u,pw:p};
}

function kidSubmit(k){return async function(fd){
  var name=String(fd.get("name")||"").trim();if(!name){dlgErr("Enter a name.");return false;}
  var ageRaw=String(fd.get("age")||"").trim(),age=ageRaw?intIn(ageRaw,1,18):null;if(ageRaw&&age===null){dlgErr("Age must be a whole number from 1 to 18.");return false;}

  catch(e){closeDialog();toast(name+" was added, but the login wasn't created: "+friendly(e));ui.tab="kids";render();return true;}

  if(!rs.length){toast("Add a reward first");return;}
  var first=true,h='<p style="margin:0">'+esc(k.name)+' has <strong>'+bal+'</strong> points.</p><fieldset style="border:0;padding:0;margin:0"><legend class="sr">Reward</legend><div class="stack" style="gap:6px">';
  rs.forEach(function(r){var ok=bal>=r.cost;h+='<label class="row"><input type="radio" name="reward" value="'+r.id+'"'+(ok?"":" disabled")+(ok&&first?" checked":"")+'> <span class="grow">'+esc(r.title)+'</span><span class="pill b-reward">'+r.cost+'</span>'+(ok?"":'<span class="small muted">'+(r.cost-bal)+' to go</span>')+'</label>';if(ok)first=false;});
  h+='</div></fieldset>';
  openDialog("Redeem a reward",h,async function(fd){var rid=fd.get("reward"),r=fam.rewards.find(function(z){return z.id===rid;});
    if(!r){dlgErr("Pick a reward "+k.name+" has enough points for.");return false;}
    if(balance(k.id)<r.cost){dlgErr("Not enough points.");return false;}
    await store.addEntry(fid(),entry(k.id,"reward",-r.cost,r.title));toast(k.name+" redeemed "+r.title);return true;},"Redeem");
}
function pwChangeDialog(){
  openDialog("Change password",'<label class="f">Current password<input type="password" name="cur" autocomplete="current-password"></label><label class="f">New password (at least 6 characters)<input type="password" name="pw" autocomplete="new-password"></label><label class="f">Repeat new password<input type="password" name="pw2" autocomplete="new-password"></label>',
    async function(fd){var c=String(fd.get("cur")||""),p=String(fd.get("pw")||""),p2=String(fd.get("pw2")||"");
      if(p.length<6){dlgErr("The new password needs at least 6 characters.");return false;}if(p!==p2){dlgErr("The new passwords don't match.");return false;}
      try{await store.changePassword(c,p);}catch(e){if(e.code==="bad-login"||e.code==="auth/wrong-password"||e.code==="auth/invalid-credential"){dlgErr("The current password isn't right.");return false;}throw e;}
      toast("Password changed");return true;},"Change password");
}
function parentAddDialog(){
  openDialog("Add a parent",'<p class="small" style="margin:0">They\'ll log in on the Parent login page with this email and password, and can change the password later.</p><label class="f">Name<input type="text" name="name" maxlength="40" required></label><label class="f">Email<input type="email" name="email" maxlength="120" required></label><label class="f">Temporary password (at least 6 characters)<input type="text" name="pw" maxlength="100" autocomplete="off" spellcheck="false"></label>',
    async function(fd){var n=String(fd.get("name")||"").trim(),em=String(fd.get("email")||"").trim(),p=String(fd.get("pw")||"");
      if(!n){dlgErr("Enter a name.");return false;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){dlgErr("Enter a valid email address.");return false;}if(p.length<6){dlgErr("The password needs at least 6 characters.");return false;}
      await store.addParent(fid(),n,em,p);toast(n+" can now log in as a parent");return true;},"Add parent");
}

/* ---------- events ---------- */
async function toggleTask(tid){
  var kid=kidById(session.kidId),t=fam.tasks.find(function(z){return z.id===tid;});if(!kid||!t||ui.pending[tid])return;
  ui.pending[tid]=true;var ex=doneToday(kid.id,t.id);
  await act(function(){return ex?store.deleteEntry(fid(),ex):store.addEntry(fid(),entry(kid.id,"task",t.points,t.title,t.id));},ex?null:"+"+t.points+" points! Great job!");
  delete ui.pending[tid];render();var b=app.querySelector('[data-action="toggle-task"][data-id="'+tid+'"]');if(b)b.focus();
}
function copyText(txt){
  function fb(){try{var ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();toast(ok?"Copied":"Couldn't copy \u2014 select and copy it yourself");}catch(e){toast("Couldn't copy \u2014 select and copy it yourself");}}
  try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(function(){toast("Copied");},fb);else fb();}catch(e){fb();}
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-action]");if(!el)return;
  var a=el.getAttribute("data-action"),did=el.getAttribute("data-id");
  var k=did&&fam?kidById(did):null;
  switch(a){
    case "go":go(el.getAttribute("data-to")||"");break;
    case "home":go(session&&session.role==="parent"?"parent":session&&session.role==="kid"?"me":"");break;
    case "logout":act(async function(){await store.logout();setSession(null);go("");},"Logged out");break;
    case "forgot":{var em=app.querySelector('[name="email"]');var v=em?em.value.trim():"";var fe=document.getElementById("formErr");
      if(!v){if(fe)fe.textContent="Type your email above first, then choose Forgot password.";break;}
      store.sendReset(v).then(function(){if(fe)fe.textContent="";toast("Check your email for a reset link");},function(e){if(fe)fe.textContent=friendly(e);});break;}
    case "toggle-task":toggleTask(did);break;
    case "tab":ui.tab=did;ui.showAll=false;render();var tb=document.getElementById("tab-"+did);if(tb)tb.focus();break;
    case "quick":if(k){var amt=Number(el.getAttribute("data-amt")),note=el.getAttribute("data-note");act(function(){return store.addEntry(fid(),entry(k.id,amt>0?"bonus":"deduction",amt,note));},fmt(amt)+" points for "+k.name);}break;
    case "adjust":if(k)adjustDialog(k);break;
    case "redeem-pick":if(k)redeemDialog(k);break;
    case "kid-add":openDialog("Add a child",kidForm(null,true),kidSubmit(null),"Add child");break;
    case "kid-edit":if(k)openDialog("Edit child",kidForm(k,false),kidSubmit(k));break;
    case "kid-login":if(k)kidLoginDialog(k);break;
    case "kid-del":if(k)confirmBox("Remove "+k.name+"?",k.name+", their login and all of their points history will be removed.","Remove",async function(){await store.deleteKid(fid(),k.id);toast(k.name+" removed");return true;});break;
    case "task-add":openDialog("Add task",taskForm(null),taskSubmit(null));break;
    case "task-edit":{var t2=fam.tasks.find(function(z){return z.id===did;});if(t2)openDialog("Edit task",taskForm(t2),taskSubmit(t2));break;}
    case "task-del":{var t3=fam.tasks.find(function(z){return z.id===did;});if(t3)confirmBox("Delete "+t3.title+"?","Points already earned for this task stay in the history.","Delete",async function(){await store.mutate(fid(),function(d){return {tasks:d.tasks.filter(function(z){return z.id!==t3.id;})};});toast("Task deleted");return true;});break;}
    case "reward-add":openDialog("Add reward",rewardForm(null),rewardSubmit(null));break;
    case "reward-edit":{var r=fam.rewards.find(function(z){return z.id===did;});if(r)openDialog("Edit reward",rewardForm(r),rewardSubmit(r));break;}
    case "reward-del":{var r2=fam.rewards.find(function(z){return z.id===did;});if(r2)confirmBox("Delete "+r2.title+"?","This removes the reward. Past redemptions stay in the history.","Delete",async function(){await store.mutate(fid(),function(d){return {rewards:d.rewards.filter(function(z){return z.id!==r2.id;})};});toast("Reward deleted");return true;});break;}
    case "del-entry":{var e=ledger.find(function(z){return z.id===did;});if(e){var kk=kidById(e.kidId);confirmBox("Delete this entry?",fmt(e.amount)+" points ("+e.note+") will be reversed"+(kk?" for "+kk.name:"")+".","Delete",async function(){await store.deleteEntry(fid(),e);toast("Entry deleted");return true;});}break;}
    case "hist-more":ui.showAll=!ui.showAll;render();break;
    case "parent-add":parentAddDialog();break;
    case "parent-del":{var p=(fam.parents||[]).find(function(z){return z.uid===did;});if(p)confirmBox("Remove "+p.name+"?",p.name+" will no longer be able to open this family's Parent panel.","Remove",async function(){await store.removeParent(fid(),p.uid);toast(p.name+" removed");return true;});break;}
    case "rename":openDialog("Rename family",'<label class="f">Family name<input type="text" name="name" maxlength="40" value="'+esc(fam.name)+'"></label>',async function(fd){var n=String(fd.get("name")||"").trim();if(!n){dlgErr("Enter a family name.");return false;}await store.mutate(fid(),function(){return {name:n};});toast("Saved");return true;});break;
    case "change-pw":pwChangeDialog();break;
    case "copy":copyText(el.getAttribute("data-text")||"");break;
    case "dlg-cancel":closeDialog();break;
    case "export":{try{var blob=new Blob([JSON.stringify({family:fam,ledger:ledger},null,2)],{type:"application/json"});var url=URL.createObjectURL(blob);var link=document.createElement("a");link.href=url;link.download="kids-chore-points-"+fam.code+"-"+dkey()+".json";document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);toast("Data downloaded");}catch(x){toast("Download isn't available here");}break;}
  }
});
document.addEventListener("keydown",function(ev){
  var el=ev.target;
  if(el.matches&&el.matches('[role="tab"]')&&(ev.key==="ArrowRight"||ev.key==="ArrowLeft")){
    var i=TABS.findIndex(function(t){return t[0]===ui.tab;});i=(i+(ev.key==="ArrowRight"?1:TABS.length-1))%TABS.length;ui.tab=TABS[i][0];render();document.getElementById("tab-"+ui.tab).focus();}
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.getAttribute("data-change")==="hist-kid"){ui.histKid=el.value;ui.showAll=false;render();var s=app.querySelector('[data-change="hist-kid"]');if(s)s.focus();}
});
document.addEventListener("submit",async function(ev){
  var f=ev.target,kind=f.getAttribute("data-form");if(!kind)return;ev.preventDefault();
  var fd=new FormData(f),btn=f.querySelector('[type="submit"]');
  if(btn&&btn.disabled)return;
  function fail(m){var x=document.getElementById(kind==="dialog"?"dlgErr":"formErr");if(x)x.textContent=m;}
  if(btn)btn.disabled=true;
  try{
    if(kind==="dialog"){if(!dlgHandler)return;var res=await dlgHandler(fd);if(res===true)closeDialog();return;}
    if(kind==="register"){
      var finishing=session&&!session.role;
      var o={familyName:String(fd.get("familyName")||"").trim(),parentName:String(fd.get("parentName")||"").trim(),email:String(fd.get("email")||"").trim(),password:String(fd.get("password")||""),defaults:!!fd.get("defaults")};
      if(!o.familyName)return fail("Enter a family name.");if(!o.parentName)return fail("Enter your name.");
      if(!finishing){if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email))return fail("Enter a valid email address.");if(o.password.length<6)return fail("The password needs at least 6 characters.");if(o.password!==String(fd.get("password2")||""))return fail("The two passwords don't match.");}
      var s=await store.register(o);ui.tab="kids";setSession(s);go("parent");toast("Welcome! Now add your kids.");return;
    }
    if(kind==="login"){
      var em=String(fd.get("email")||"").trim(),pw=String(fd.get("password")||"");if(!em||!pw)return fail("Enter your email and password.");
      var s2=await store.loginParent(em,pw);if(s2.role==="kid"){await store.logout();return fail("That's a kid account. Use the Kid login page.");}
      ui.tab="overview";setSession(s2);go(s2.role?"parent":"register");return;
    }
    if(kind==="kidlogin"){
      var code=String(fd.get("code")||"").trim().toUpperCase(),un=String(fd.get("username")||"").trim().toLowerCase(),kp=String(fd.get("password")||"");
      if(!/^[A-Z0-9]{6}$/.test(code))return fail("The family code has 6 letters and numbers.");if(!un||!kp)return fail("Enter your username and password.");
      var s3=await store.loginKid(code,un,kp);try{localStorage.setItem(LAST_FAMILY,code);}catch(x){}
      setSession(s3);go("me");return;
    }
  }catch(e){console.error(e);fail(friendly(e));}
  finally{if(btn&&btn.isConnected)btn.disabled=false;}
});


store.init(function(s){setSession(s);}).catch(function(e){console.error(e);app.innerHTML='<div class="card empty"><h1>Couldn\'t start</h1><p>The site couldn\'t connect to its online service. Check your internet connection and reload the page.</p></div>';});

})();
</script>
