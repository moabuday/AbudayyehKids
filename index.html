<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kids Chore Points</title>
<style>
:root{
  --bg:#f6f7fb;--card:#ffffff;--fg:#14161f;--muted:#4b5163;--border:#e2e5ee;--soft:#eef0f6;
  --primary:#3b4fc4;--primary-fg:#ffffff;--primary-soft:#e7eafb;
  --ok:#0f7a4a;--ok-soft:#e3f6ec;--ok-fg:#0b4d30;
  --bad:#b42318;--bad-soft:#fde8e6;--bad-fg:#7a1a12;
  --info:#1d5fbf;--info-soft:#e4eefc;--info-fg:#143f7f;
  --gold:#b45309;--gold-soft:#fdf0dc;--gold-fg:#6b3407;--gold-mark:#f59e0b;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1117;--card:#181b24;--fg:#f2f3f7;--muted:#b4b9c8;--border:#2b2f3c;--soft:#222633;
    --primary:#7d8cf0;--primary-fg:#0f1117;--primary-soft:#262c4d;
    --ok:#4ccf8f;--ok-soft:#12301f;--ok-fg:#c8f2dc;
    --bad:#ff8a80;--bad-soft:#3a1715;--bad-fg:#ffd5d0;
    --info:#86b4ff;--info-soft:#152844;--info-fg:#d3e3ff;
    --gold:#fbbf24;--gold-soft:#3a2a0e;--gold-fg:#fde7b0;--gold-mark:#f59e0b;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:var(--bg);color:var(--fg)}
body{margin:0;min-height:100vh;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.wrap{max-inline-size:1120px;margin-inline:auto;padding:20px 16px 48px}
header.top{position:sticky;inset-block-start:0;z-index:10;background:var(--card);border-block-end:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.logo{inline-size:34px;block-size:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center}
.logo svg{inline-size:20px;block-size:20px;fill:var(--primary-fg)}
.family{color:var(--muted);font-weight:500;font-size:.95rem}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--primary);color:var(--primary-fg);min-block-size:38px}
.btn:hover{filter:brightness(1.07)}
.btn.outline{background:var(--card);color:var(--fg);border-color:var(--border)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.ghost:hover,.btn.outline:hover{background:var(--soft);filter:none}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;min-block-size:32px;font-size:.9rem}
.btn.icon{padding:6px;min-inline-size:34px;min-block-size:34px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.15rem;margin:0 0 12px}
h3{font-size:1rem;margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;gap:20px;grid-template-columns:1.15fr 1fr}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.alert{border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold-fg);border-radius:10px;padding:10px 14px;margin-block-end:16px}
.avatar{inline-size:38px;block-size:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.avatar.lg{inline-size:60px;block-size:60px;font-size:1.6rem}
.avatar.sm{inline-size:28px;block-size:28px;font-size:.8rem}
.c0{background:#1d6fa5}.c1{background:#be123c}.c2{background:#047857}.c3{background:#6d28d9}.c4{background:#b45309}.c5{background:#0f766e}
.kidpick{display:flex;gap:10px;flex-wrap:wrap;margin-block-end:20px}
.kidbtn{display:flex;align-items:center;gap:10px;border:2px solid var(--border);background:var(--card);border-radius:999px;padding:4px 16px 4px 4px;cursor:pointer;font-weight:600}
.kidbtn[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.score{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-block-end:20px}
.big{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.bar{block-size:10px;background:var(--primary-soft);border-radius:999px;overflow:hidden}
.bar>span{display:block;block-size:100%;background:var(--primary);border-radius:999px}
ul.clean{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:12px;inline-size:100%;text-align:start;min-block-size:58px;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;margin-block-end:8px}
.task:hover{background:var(--soft)}
.task[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.tick{inline-size:32px;block-size:32px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex:none}
.task[aria-pressed="true"] .tick{background:var(--ok);border-color:var(--ok)}
.tick svg{inline-size:18px;block-size:18px;stroke:#fff;fill:none;stroke-width:3;display:none}
@media (prefers-color-scheme: dark){.tick svg{stroke:#0f1117}}
.task[aria-pressed="true"] .tick svg{display:block}
.task .t{flex:1;font-weight:600}
.pill{border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--fg);white-space:nowrap}
.task[aria-pressed="true"] .pill{background:var(--ok);color:var(--card)}
.b-task{background:var(--ok-soft);color:var(--ok-fg)}
.b-bonus{background:var(--info-soft);color:var(--info-fg)}
.b-deduction{background:var(--bad-soft);color:var(--bad-fg)}
.b-reward{background:var(--gold-soft);color:var(--gold-fg)}
.list>li{display:flex;align-items:center;gap:12px;padding:10px 0;border-block-end:1px solid var(--border)}
.list>li:last-child{border-block-end:0}
.grow{flex:1;min-inline-size:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:800;font-variant-numeric:tabular-nums;min-inline-size:3.2em;text-align:end}
.amt.pos{color:var(--ok)}.amt.neg{color:var(--bad)}
.small{font-size:.85rem}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-block-end:1px solid var(--border);margin-block-end:20px}
.tab{background:none;border:0;border-block-end:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-block-end-color:var(--primary)}
.kidcards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-block:12px}
form.stack{display:grid;gap:12px}
label.f{display:grid;gap:5px;font-weight:600;font-size:.92rem}
input[type=text],input[type=number],input[type=password],input[type=email],select{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 11px;min-block-size:40px;inline-size:100%}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:8px;cursor:pointer;font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--primary);color:var(--primary-fg)}
.seg label:has(input:focus-visible){outline:3px solid var(--primary);outline-offset:-3px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches .avatar{border:3px solid transparent}
.swatches input:checked + .avatar{border-color:var(--fg)}
.swatches input:focus-visible + .avatar{outline:3px solid var(--primary);outline-offset:2px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;align-items:center;gap:6px;font-weight:500}
.err{color:var(--bad);font-size:.9rem;margin:0}
dialog{border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--fg);padding:22px;inline-size:min(460px,92vw)}
dialog::backdrop{background:rgba(10,12,20,.55)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-block-start:6px}
.hero{max-inline-size:520px;margin:40px auto}
.empty{padding:24px;text-align:center;color:var(--muted)}
figure{margin:0}
svg text{font-family:inherit}
.week{display:flex;align-items:flex-end;gap:6px;block-size:70px;margin-block:8px 2px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;block-size:100%}
.week i{display:block;inline-size:100%;background:var(--primary);border-radius:4px 4px 0 0;min-block-size:2px}
.week b{font-size:.72rem;font-weight:600;color:var(--muted)}
.weeklbl{display:flex;gap:6px}.weeklbl span{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:.85rem;text-align:center;padding:24px}
@media (forced-colors: active){.btn,.task,.kidbtn,.tab{border:1px solid ButtonText}.task[aria-pressed="true"],.kidbtn[aria-pressed="true"],.tab[aria-selected="true"]{outline:3px solid Highlight}}
.brandbtn{background:none;border:0;padding:0;cursor:pointer}
.home{display:grid;gap:20px;grid-template-columns:1fr 1fr;margin-block-start:20px}
@media (max-width:760px){.home{grid-template-columns:1fr}}
.home .card{display:flex;flex-direction:column;gap:10px}
.lead{font-size:1.1rem;max-inline-size:640px}
.steps{list-style:none;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-block-start:20px}
.num{inline-size:30px;block-size:30px;border-radius:50%;background:var(--primary-soft);color:var(--fg);display:grid;place-items:center;font-weight:800;flex:none}
.code{font-family:ui-monospace,Consolas,monospace;font-size:1.6rem;font-weight:800;letter-spacing:.15em}
.linkbox{font-family:ui-monospace,Consolas,monospace;font-size:.85rem;background:var(--soft);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.kidhero{max-inline-size:440px;margin:30px auto}
.kidhero input{font-size:1.15rem;min-block-size:48px}
.kidhero .btn{min-block-size:48px;font-size:1.05rem}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:600;background:var(--soft)}
.tag.ok{background:var(--ok-soft);color:var(--ok-fg)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:600;cursor:pointer;text-decoration:underline}
@media (max-width:560px){.hide-sm{display:none}}
.trackwrap{overflow-x:auto;margin-block-start:8px}
table.track{border-collapse:separate;border-spacing:4px;inline-size:100%;min-inline-size:540px}
.track th{font-weight:600;font-size:.8rem;color:var(--muted);text-align:center;padding:2px}
.track thead th span{display:block}
.track thead th b{display:block;font-size:1.05rem;color:var(--fg)}
.track thead th.today{background:var(--primary-soft);border-radius:10px}
.track thead th.today b,.track thead th.today span{color:var(--fg)}
.track .tname{text-align:start;min-inline-size:150px;max-inline-size:240px;position:sticky;inset-inline-start:0;background:var(--card);z-index:1;box-shadow:6px 0 6px -6px rgba(0,0,0,.25)}
.track tbody th.tname{color:var(--fg);font-size:.92rem}
.track tbody th.tname span{display:block}
.track td{text-align:center;padding:0}
.track tfoot td,.track tfoot th{color:var(--muted)}
.cell{inline-size:38px;block-size:38px;border-radius:10px;border:2px solid var(--border);background:var(--card);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.cell svg{inline-size:20px;block-size:20px;stroke:#fff;fill:none;stroke-width:3;display:none}
@media (prefers-color-scheme: dark){.cell svg{stroke:#0f1117}}
button.cell:hover{border-color:var(--primary)}
.cell[aria-pressed="true"],.cell.ro[data-done="true"]{background:var(--ok);border-color:var(--ok)}
.cell[aria-pressed="true"] svg,.cell.ro[data-done="true"] svg{display:block}
.cell.ro{cursor:default;border-style:dashed}
.cell.off{border:0;background:none;color:var(--muted);cursor:default}
.cell:disabled{opacity:.6;cursor:progress}
.weeknav{gap:8px}
.track .tn{overflow-wrap:anywhere}
@media (max-width:560px){table.track{min-inline-size:0;border-spacing:3px;table-layout:fixed;inline-size:100%}.track thead th.tname{inline-size:34%}.track .tname{min-inline-size:0;inline-size:30%;max-inline-size:none}.track tbody th.tname{font-size:.8rem}.track th{font-size:.7rem}.track thead th b{font-size:.9rem}.cell{inline-size:30px;block-size:30px;border-radius:8px}.cell svg{inline-size:16px;block-size:16px}}
.task[aria-busy="true"]{opacity:.7;cursor:progress}
.taskrow{display:flex;gap:8px;align-items:stretch}
.taskrow .task{flex:1;min-inline-size:0}
.camb{margin-block-end:8px;min-inline-size:54px;background:var(--card);color:var(--fg);border-color:var(--border);border-radius:12px}
.camb:hover{background:var(--soft);filter:none}
.camb.need{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.camb.has{background:var(--ok-soft);color:var(--ok-fg);border-color:var(--ok)}
.needp{display:block;font-weight:400}
label.btn:focus-within{outline:3px solid var(--primary);outline-offset:2px}
.cell{position:relative}
.phdot{position:absolute;inset-block-start:-7px;inset-inline-end:-7px;inline-size:18px;block-size:18px;border-radius:50%;background:var(--primary);display:grid;place-items:center;border:2px solid var(--card)}
.cell .phdot svg{display:block;inline-size:11px;block-size:11px;stroke:var(--primary-fg);stroke-width:2.5}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.phbtn{display:grid;place-items:center;aspect-ratio:1;inline-size:100%;padding:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--soft);color:var(--muted);cursor:pointer}
.phbtn img{inline-size:100%;block-size:100%;object-fit:cover;display:block}
.phph svg{inline-size:34px;block-size:34px}
.phbig{display:grid;place-items:center;min-block-size:120px}
.phbig img,.phprev{max-inline-size:100%;max-block-size:58vh;border-radius:12px;display:block;margin-inline:auto}
.phprev{max-block-size:40vh}
@media (forced-colors: active){.phdot{border:1px solid CanvasText}}
@media (forced-colors: active){.cell{border:1px solid ButtonText}.cell[aria-pressed="true"],.cell.ro[data-done="true"]{background:Highlight}}
</style>
</head>

function shrinkPhoto(file){
  var max=MODE==="sheets"?1280:720,q=MODE==="sheets"?0.75:0.6;
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),im=new Image();
    im.addEventListener("load",function(){try{var w=im.naturalWidth,h=im.naturalHeight,sc=Math.min(1,max/Math.max(w,h));var c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      var cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",q));}catch(x){reject(x);}});
    im.addEventListener("error",function(){URL.revokeObjectURL(url);reject(new Error("img"));});
    im.src=url;
  });
}

  '<label class="f">Password<input type="text" name="kidpw" maxlength="30" autocomplete="off" spellcheck="false" placeholder="at least 4 characters"></label><p class="small muted" style="margin:-6px 0 0">Shown as you type so you can tell your child. You can reset it any time.</p>';
}
function loginInfo(name,username,pw){
  var link=kidLink(data.family.code);
  info(name+" can log in now",'<p style="margin:0">Give these details to '+esc(name)+':</p><ul class="clean list"><li><span class="grow">Family code</span><strong class="code" style="font-size:1.1rem">'+esc(data.family.code)+'</strong></li><li><span class="grow">Username</span><strong>'+esc(username)+'</strong></li><li><span class="grow">Password</span><strong>'+esc(pw)+'</strong></li></ul><p class="small" style="margin:0">Kid login link:</p><div class="linkbox">'+esc(link)+'</div><div class="row"><button type="button" class="btn outline sm" data-action="copy" data-text="'+esc(link)+'">Copy link</button></div>');
}
function readLogin(fd){
  var u=String(fd.get("username")||"").trim().toLowerCase(),p=String(fd.get("kidpw")||"");
  if(!/^[a-z0-9][a-z0-9.-]{1,19}$/.test(u)){dlgErr("Usernames are 2\u201320 lowercase letters, numbers, dots or dashes.");return null;}
  if(p.length<4){dlgErr("The password needs at least 4 characters.");return null;}
  return {username:u,password:p};
}
function kidForm(k,withLogin){
  var h='<label class="f">Child\'s name<input type="text" name="name" maxlength="30" value="'+(k?esc(k.name):"")+'" required></label>';
  h+='<label class="f">Age (optional)<input type="number" name="age" min="1" max="18" value="'+(k&&k.age?esc(k.age):"")+'"></label>';
  h+='<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-block-end:6px">Colour</legend><div class="swatches">';
  var cur=k?k.color:(data.kids.length%COLORS);
  for(var i=0;i<COLORS;i++)h+='<label><input type="radio" name="color" value="'+i+'"'+(i===cur?" checked":"")+' aria-label="Colour '+(i+1)+'"><span class="avatar c'+i+'" aria-hidden="true">'+esc(initial(k?k.name:"A"))+'</span></label>';
  h+='</div></fieldset>';
  if(withLogin)h+='<fieldset style="border:1px solid var(--border);border-radius:12px;padding:12px;margin:0;display:grid;gap:12px"><legend style="font-weight:700;padding-inline:4px">Login for the Kid login page</legend>'+loginFields(null)+'</fieldset>';
  return h;
}
function kidSubmit(k){return async function(fd){
  var name=String(fd.get("name")||"").trim();if(!name){dlgErr("Enter a name.");return false;}
  var ageRaw=String(fd.get("age")||"").trim(),age=ageRaw?intIn(ageRaw,1,18):null;if(ageRaw&&age===null){dlgErr("Age must be a whole number from 1 to 18.");return false;}
  var color=Number(fd.get("color")||0);
  if(k){await api("saveKid",{kid:{id:k.id,name:name,age:age,color:color}});toast("Saved");return true;}
  var login=readLogin(fd);if(!login)return false;
  await api("saveKid",{kid:{name:name,age:age,color:color},login:login});
  closeDialog();loginInfo(name,login.username,login.password);return "keep";
};}
function kidLoginDialog(k){
  openDialog((k.username?"Reset login for ":"Create login for ")+k.name,(k.username?'<p class="small" style="margin:0">A new password replaces the old one, and '+esc(k.name)+' will need to log in again. You can also change the username.</p>':"")+loginFields(k),
    async function(fd){var l=readLogin(fd);if(!l)return false;await api("setKidLogin",{kidId:k.id,username:l.username,password:l.password});closeDialog();loginInfo(k.name,l.username,l.password);return "keep";},k.username?"Reset login":"Create login");
}
function taskForm(t){
  var sch=t?t.schedule||"daily":"daily",mode=sch.indexOf("days:")===0?"days":sch.indexOf("once:")===0?"once":"daily";
  var days=mode==="days"?sch.slice(5).split(","):[],once=mode==="once"?sch.slice(5):dkey();
  var h='<label class="f">Task<input type="text" name="title" maxlength="60" value="'+(t?esc(t.title):"")+'" required></label><label class="f">Points<input type="number" name="points" min="1" max="1000" value="'+(t?t.points:5)+'"></label>';
  h+='<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-block-end:6px">How often?</legend><div class="seg"><label><input type="radio" name="freq" value="daily"'+(mode==="daily"?" checked":"")+'> Every day</label><label><input type="radio" name="freq" value="days"'+(mode==="days"?" checked":"")+'> Some days</label><label><input type="radio" name="freq" value="once"'+(mode==="once"?" checked":"")+'> One day</label></div></fieldset>';
  h+='<fieldset class="freq-days" style="border:0;padding:0;margin:0"'+(mode==="days"?"":" hidden")+'><legend class="small" style="font-weight:600;margin-block-end:6px">Which days?</legend><div class="checks">';
  [6,0,1,2,3,4,5].forEach(function(d){h+='<label><input type="checkbox" name="wd" value="'+d+'"'+(days.indexOf(String(d))>=0?" checked":"")+'> '+WD[d]+'</label>';});
  h+='</div></fieldset><label class="f freq-once"'+(mode==="once"?"":" hidden")+'>Date<input type="date" name="once" value="'+esc(once)+'"></label>';
  if(data.kids.length){h+='<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-block-end:6px">Who does this task? <span class="small muted">(none ticked = all kids)</span></legend><div class="checks">';
    data.kids.forEach(function(k){h+='<label><input type="checkbox" name="kid" value="'+k.id+'"'+(t&&t.kidIds.indexOf(k.id)>=0?" checked":"")+'> '+esc(k.name)+'</label>';});h+='</div></fieldset>';}
  h+='<label class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:8px"><input type="checkbox" name="needphoto" style="inline-size:auto;margin-block-start:4px"'+(t&&t.photo==="required"?" checked":"")+'><span>Kids must add a photo to finish this task<span class="small muted" style="display:block">Kids can always add a photo to any task; this makes it required.</span></span></label>';
  return h;
}
function taskSubmit(t){return async function(fd){
  var title=String(fd.get("title")||"").trim(),pts=intIn(fd.get("points"),1,1000);
  if(!title){dlgErr("Enter a task name.");return false;}if(pts===null){dlgErr("Points must be a whole number from 1 to 1,000.");return false;}
  var freq=fd.get("freq")||"daily",schedule="daily";
  if(freq==="days"){var wd=fd.getAll("wd").map(String);if(!wd.length){dlgErr("Pick at least one day.");return false;}schedule="days:"+wd.sort().join(",");}
  if(freq==="once"){var d=String(fd.get("once")||"");if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){dlgErr("Pick a date.");return false;}schedule="once:"+d;}
  var task={title:title,points:pts,kidIds:fd.getAll("kid").map(String),schedule:schedule,photo:fd.get("needphoto")?"required":""};if(t)task.id=t.id;
  await api("saveTask",{task:task});toast(t?"Task saved":"Task added");return true;};}
function rewardForm(r){return '<label class="f">Reward<input type="text" name="title" maxlength="60" value="'+(r?esc(r.title):"")+'" required></label><label class="f">Points needed<input type="number" name="cost" min="1" max="100000" value="'+(r?r.cost:50)+'"></label>';}
function rewardSubmit(r){return async function(fd){
  var title=String(fd.get("title")||"").trim(),cost=intIn(fd.get("cost"),1,100000);
  if(!title){dlgErr("Enter a reward name.");return false;}if(cost===null){dlgErr("Points must be a whole number from 1 to 100,000.");return false;}
  var rw={title:title,cost:cost};if(r)rw.id=r.id;await api("saveReward",{reward:rw});toast(r?"Reward saved":"Reward added");return true;};}
function adjustDialog(k){
  openDialog("Adjust "+k.name+"'s points",
    '<div class="seg" role="radiogroup" aria-label="Add or deduct"><label><input type="radio" name="type" value="bonus" checked> Add</label><label><input type="radio" name="type" value="deduction"> Deduct</label></div>'+
    '<label class="f">Points<input type="number" name="amount" min="1" max="1000" value="5"></label><label class="f">Reason<input type="text" name="note" maxlength="80" placeholder="e.g. Helped his sister"></label>',
    async function(fd){var type=fd.get("type")==="deduction"?"deduction":"bonus",n=intIn(fd.get("amount"),1,1000);
      if(n===null){dlgErr("Points must be a whole number from 1 to 1,000.");return false;}
      await api("addEntry",{entry:{kidId:k.id,type:type,amount:n,note:String(fd.get("note")||"").trim(),date:dkey()}});toast(fmt(type==="bonus"?n:-n)+" points for "+k.name);return true;},"Save");
}
function redeemDialog(k){
  var bal=balance(k.id),rs=data.rewards.slice().sort(function(a,b){return a.cost-b.cost;});
  if(!rs.length){toast("Add a reward first");return;}
  var first=true,h='<p style="margin:0">'+esc(k.name)+' has <strong>'+bal+'</strong> points.</p><fieldset style="border:0;padding:0;margin:0"><legend class="sr">Reward</legend><div class="stack" style="gap:6px">';
  rs.forEach(function(r){var ok=bal>=r.cost;h+='<label class="row"><input type="radio" name="reward" value="'+r.id+'"'+(ok?"":" disabled")+(ok&&first?" checked":"")+'> <span class="grow">'+esc(r.title)+'</span><span class="pill b-reward">'+r.cost+'</span>'+(ok?"":'<span class="small muted">'+(r.cost-bal)+' to go</span>')+'</label>';if(ok)first=false;});
  h+='</div></fieldset>';
  openDialog("Redeem a reward",h,async function(fd){var rid=fd.get("reward"),r=data.rewards.find(function(z){return z.id===rid;});
    if(!r){dlgErr("Pick a reward "+k.name+" has enough points for.");return false;}
    await api("addEntry",{entry:{kidId:k.id,type:"reward",rewardId:r.id,date:dkey()}});toast(k.name+" redeemed "+r.title);return true;},"Redeem");
}
function pwChangeDialog(){
  openDialog("Change password",'<label class="f">Current password<input type="password" name="cur" autocomplete="current-password"></label><label class="f">New password (at least 6 characters)<input type="password" name="pw" autocomplete="new-password"></label><label class="f">Repeat new password<input type="password" name="pw2" autocomplete="new-password"></label>',

      await api("changePassword",{oldPassword:c,newPassword:p});toast("Password changed");return true;},"Change password");

function parentAddDialog(){
  openDialog("Add a parent",'<p class="small" style="margin:0">They\'ll log in on the Parent login page with this email and password, and can change the password later.</p><label class="f">Name<input type="text" name="name" maxlength="40" required></label><label class="f">Email<input type="email" name="email" maxlength="120" required></label><label class="f">Temporary password (at least 6 characters)<input type="text" name="pw" maxlength="100" autocomplete="off" spellcheck="false"></label>',

      if(!n){dlgErr("Enter a name.");return false;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){dlgErr("Enter a valid email address.");return false;}if(p.length<6){dlgErr("The password needs at least 6 characters.");return false;}

/* ---------- events ---------- */
function toggleTask(kidId,taskId,date,btn){
  var k=okey(kidId,taskId,date);if(k in ui.optimistic)return;
  var ex=entryFor(kidId,taskId,date),t=data.tasks.find(function(z){return z.id===taskId;}),isKid=session().kind==="kid";
  if(!ex&&isKid&&t&&t.photo==="required"){photoDialog(kidId,taskId,date);return;}
  if(ex&&ex.photo&&!toggleTask.ok){confirmBox("Untick "+(t?t.title:"this task")+"?","The points and the photo for this day will be removed.","Untick",function(){toggleTask.ok=true;try{toggleTask(kidId,taskId,date,null);}finally{toggleTask.ok=false;}return true;});return;}
  ui.optimistic[k]=!ex;render();refocus(kidId,taskId,date,btn);
  var p=ex?api("deleteEntry",{id:ex.id}):api("addEntry",{entry:{kidId:kidId,type:"task",taskId:taskId,date:date}});
  p.then(function(){delete ui.optimistic[k];render();refocus(kidId,taskId,date,btn);if(!ex&&t&&session().kind==="kid")toast("+"+t.points+" points! Great job!");},
    function(e){delete ui.optimistic[k];console.error(e);toast(friendly(e));if(e.code==="not-found"||e.code==="already-done")refresh();render();refocus(kidId,taskId,date,btn);});
}
function refocus(kidId,taskId,date,btn){var cls=btn&&btn.classList.contains("task")?".task":".cell";var b=app.querySelector(cls+'[data-kid="'+kidId+'"][data-task="'+taskId+'"][data-date="'+date+'"]');if(b&&document.activeElement!==b)b.focus();}
function copyText(txt){
  function fb(){try{var ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();toast(ok?"Copied":"Couldn't copy \u2014 select and copy it yourself");}catch(e){toast("Couldn't copy \u2014 select and copy it yourself");}}
  try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(function(){toast("Copied");},fb);else fb();}catch(e){fb();}
}
function quiet(p,ok){return p.then(function(){if(ok)toast(ok);},function(e){console.error(e);toast(friendly(e));});}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-action]");if(!el)return;
  var a=el.getAttribute("data-action"),did=el.getAttribute("data-id");
  var k=did&&data?kidById(did):null;
  switch(a){
    case "go":go(el.getAttribute("data-to")||"");break;
    case "home":{var s0=session();go(s0&&s0.kind==="parent"?"parent":s0&&s0.kind==="kid"?"me":"");break;}
    case "retry":boot();break;
    case "refresh":quiet(refresh(),"Up to date");break;
    case "logout":{var t0=token;setToken(null);data=null;ui.optimistic={};backend.call("logout",{},t0).catch(function(){});go("");toast("Logged out");break;}
    case "forgot":info("Forgot your password?",'<p style="margin:0">'+(MODE==="sheets"?"Ask the person who owns your family's Google Sheet to open it and choose <strong>Kids Chore Points \u2192 Reset a parent's password</strong> from the menu. Another parent can also add you again from the Parent panel.":"In demo mode, register again or ask another parent in your family to add you again.")+'</p>');break;
    case "kid-photo":{var s1=session();if(s1&&s1.kind==="kid"){var tid=el.getAttribute("data-task"),dd=el.getAttribute("data-date"),en=entryFor(s1.id,tid,dd);if(en&&en.photo&&!dlg.contains(el))photoView(en.id);else photoDialog(s1.id,tid,dd);}break;}
    case "photo-view":photoView(did);break;
    case "photo-reject":{var pe=data.ledger.find(function(z){return z.id===did;});if(pe){var pk=kidById(pe.kidId);confirmBox("Remove this tick?",Math.abs(pe.amount)+" points"+(pk?" for "+pk.name:"")+" and the photo for \u201c"+pe.note+"\u201d will be removed.","Remove",async function(){await api("deleteEntry",{id:pe.id});delete ui.photos[pe.id];toast("Tick removed");return true;});}break;}
    case "toggle":toggleTask(el.getAttribute("data-kid"),el.getAttribute("data-task"),el.getAttribute("data-date"),el);break;
    case "tab":ui.tab=did;ui.showAll=false;render();var tb=document.getElementById("tab-"+did);if(tb)tb.focus();break;
    case "track-kid":ui.trackKid=did;ui.tab="tracker";render();break;
    case "track-week":ui.trackOffset=Math.max(0,Math.min(8,ui.trackOffset+Number(el.getAttribute("data-dir"))));render();break;
    case "kid-week":ui.kidOffset=Math.max(0,Math.min(8,ui.kidOffset+Number(el.getAttribute("data-dir"))));render();break;
    case "quick":if(k){var amt=Number(el.getAttribute("data-amt")),note=el.getAttribute("data-note");el.disabled=true;quiet(api("addEntry",{entry:{kidId:k.id,type:amt>0?"bonus":"deduction",amount:Math.abs(amt),note:note,date:dkey()}}),fmt(amt)+" points for "+k.name);}break;
    case "adjust":if(k)adjustDialog(k);break;
    case "redeem-pick":if(k)redeemDialog(k);break;
    case "kid-add":openDialog("Add a child",kidForm(null,true),kidSubmit(null),"Add child");break;
    case "kid-edit":if(k)openDialog("Edit child",kidForm(k,false),kidSubmit(k));break;
    case "kid-login":if(k)kidLoginDialog(k);break;
    case "kid-del":if(k)confirmBox("Remove "+k.name+"?",k.name+", their login and all of their points history will be removed.","Remove",async function(){await api("deleteKid",{kidId:k.id});toast(k.name+" removed");return true;});break;
    case "task-add":openDialog("Add task",taskForm(null),taskSubmit(null));break;
    case "task-edit":{var t2=data.tasks.find(function(z){return z.id===did;});if(t2)openDialog("Edit task",taskForm(t2),taskSubmit(t2));break;}
    case "task-del":{var t3=data.tasks.find(function(z){return z.id===did;});if(t3)confirmBox("Delete "+t3.title+"?","Points already earned for this task stay in the history.","Delete",async function(){await api("deleteTask",{id:t3.id});toast("Task deleted");return true;});break;}
    case "reward-add":openDialog("Add reward",rewardForm(null),rewardSubmit(null));break;
    case "reward-edit":{var r=data.rewards.find(function(z){return z.id===did;});if(r)openDialog("Edit reward",rewardForm(r),rewardSubmit(r));break;}
    case "reward-del":{var r2=data.rewards.find(function(z){return z.id===did;});if(r2)confirmBox("Delete "+r2.title+"?","This removes the reward. Past redemptions stay in the history.","Delete",async function(){await api("deleteReward",{id:r2.id});toast("Reward deleted");return true;});break;}
    case "del-entry":{var e=data.ledger.find(function(z){return z.id===did;});if(e){var kk=kidById(e.kidId);confirmBox("Delete this entry?",fmt(e.amount)+" points ("+e.note+") will be reversed"+(kk?" for "+kk.name:"")+".","Delete",async function(){await api("deleteEntry",{id:e.id});toast("Entry deleted");return true;});}break;}
    case "hist-more":ui.showAll=!ui.showAll;render();break;
    case "parent-add":parentAddDialog();break;
    case "parent-del":{var p=data.parents.find(function(z){return z.id===did;});if(p)confirmBox("Remove "+p.name+"?",p.name+" will no longer be able to open this family's Parent panel.","Remove",async function(){await api("removeParent",{id:p.id});toast(p.name+" removed");return true;});break;}
    case "rename":openDialog("Rename family",'<label class="f">Family name<input type="text" name="name" maxlength="40" value="'+esc(data.family.name)+'"></label>',async function(fd){var n=String(fd.get("name")||"").trim();if(!n){dlgErr("Enter a family name.");return false;}await api("renameFamily",{name:n});toast("Saved");return true;});break;
    case "change-pw":pwChangeDialog();break;
    case "copy":copyText(el.getAttribute("data-text")||"");break;
    case "dlg-cancel":closeDialog();break;

  }
});

document.addEventListener("submit",async function(ev){
  var f=ev.target,kind=f.getAttribute("data-form");if(!kind)return;ev.preventDefault();
  var fd=new FormData(f),btn=f.querySelector('[type="submit"]');
  if(btn&&btn.disabled)return;
  function fail(m){var x=document.getElementById(kind==="dialog"?"dlgErr":"formErr");if(x)x.textContent=m;}
  if(btn)btn.disabled=true;
  try{
    if(kind==="dialog"){if(!dlgHandler)return;var res=await dlgHandler(fd);if(res===true)closeDialog();return;}
    if(kind==="register"){
      var o={familyName:String(fd.get("familyName")||"").trim(),parentName:String(fd.get("parentName")||"").trim(),email:String(fd.get("email")||"").trim(),password:String(fd.get("password")||""),defaults:!!fd.get("defaults")};
      if(!o.familyName)return fail("Enter a family name.");if(!o.parentName)return fail("Enter your name.");
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email))return fail("Enter a valid email address.");if(o.password.length<6)return fail("The password needs at least 6 characters.");if(o.password!==String(fd.get("password2")||""))return fail("The two passwords don't match.");
      if(btn)btn.textContent="Creating\u2026";
      ui.tab="kids";await api("register",o);go("parent");toast("Welcome! Now add your kids.");return;
    }
    if(kind==="login"){
      var em=String(fd.get("email")||"").trim(),pw=String(fd.get("password")||"");if(!em||!pw)return fail("Enter your email and password.");
      ui.tab="overview";await api("loginParent",{email:em,password:pw});go("parent");return;
    }
    if(kind==="kidlogin"){
      var code=String(fd.get("code")||"").trim().toUpperCase(),un=String(fd.get("username")||"").trim().toLowerCase(),kp=String(fd.get("password")||"");
      if(!/^[A-Z0-9]{6}$/.test(code))return fail("The family code has 6 letters and numbers.");if(!un||!kp)return fail("Enter your username and password.");
      ui.kidOffset=0;await api("loginKid",{code:code,username:un,password:kp});go("me");return;
    }
  }catch(e){console.error(e);fail(friendly(e));}
  finally{if(btn&&btn.isConnected){btn.disabled=false;if(kind==="register")btn.textContent="Create family";}}
});

/* ---------- start ---------- */
function boot(){
  bootErr=null;
  if(!token){booting=false;guard();render();return;}
  booting=true;render();
  backend.call("get",{since:since()},token).then(function(res){data=res;booting=false;guard();render();},
    function(e){booting=false;if(e&&e.code==="auth"){setToken(null);data=null;}else bootErr=e;guard();render();});
}
setInterval(function(){if(MODE==="sheets"&&token&&data&&document.visibilityState==="visible"&&!dlg.open&&!Object.keys(ui.optimistic).length)refresh();},30000);
document.addEventListener("visibilitychange",function(){if(MODE==="sheets"&&document.visibilityState==="visible"&&token&&data)refresh();});
boot();

})();
